[project]
name = "interviewmaxxing-selection"
version = "0.1.0"
description = "Auditable Jev (TypeSafe via OpenRouter Decisions API) APPLY/SKIP/REVIEW selection for discovered jobs."
requires-python = ">=3.12"
dependencies = ["interviewmaxxing-core", "pydantic>=2.8,<3"]

[tool.uv.sources]
interviewmaxxing-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interviewmaxxing_selection"]
