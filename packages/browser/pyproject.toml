[project]
name = "interviewmaxxing-browser"
version = "0.1.0"
description = "Playwright browser runtime: inspect, fill, navigate, submit and confirm application forms."
requires-python = ">=3.12"
dependencies = [
    "interviewmaxxing-core",
    "playwright>=1.62,<2",
]

[tool.uv.sources]
interviewmaxxing-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interviewmaxxing_browser"]
