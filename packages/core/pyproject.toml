[project]
name = "interviewmaxxing-core"
version = "0.1.0"
description = "Canonical contracts, service interfaces and the local SQLite application store for Interviewmaxxing."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interviewmaxxing_core"]
