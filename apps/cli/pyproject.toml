[project]
name = "interviewmaxxing-cli"
version = "0.1.0"
description = "The interviewmaxxing command-line interface."
requires-python = ">=3.12"
dependencies = ["interviewmaxxing-core"]

[project.scripts]
interviewmaxxing = "interviewmaxxing_cli.main:main"

[tool.uv.sources]
interviewmaxxing-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interviewmaxxing_cli"]
